<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <title>R2CP Operator Test</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1>R2CP Operator Test</h1>
    <div id="connectionformarea">
        <form name="r2cpconnectform">
            Robot IP:&nbsp;&nbsp;&nbsp;<input type="text" name="robotip" class="robotipinput" /><br />
            Robot Port:&nbsp;<input type="text" name="robotport" class="robotportinput" /><br />
            <input type="submit" name="connectformbutton" value="Connect" />
        </form>
    </div>

    <div id="joystickarea">
        <div id="joydiv"></div>

        <div id="joyparams">
            <h2>Joystick parameters</h2>

            Shroom position X:&nbsp;<input id="joyposxinput" type="text" /><br />
            Shroom position Y:&nbsp;<input id="joyposyinput" type="text" /><br />
            Shroom angle:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input id="joyangleinput" type="text" /><br />
            Shroom magnitude:&nbsp;&nbsp;<input id="joymaginput" type="text" /><br /><br /><br />

            Right motor PWM:&nbsp;&nbsp;&nbsp;<input id="motorrpwminput" type="text" /><br />
            Left motor PWM:&nbsp;&nbsp;&nbsp;&nbsp;<input id="motorlpwminput" type="text" /><br />
        </div>
    </div>

    <div id="messagingformarea">
        <h2>Echo message input</h2>
        <form name="operatorsendform">
            <input type="text" name="message" /><br />
            <input type="submit" value="Send" />
        </form>
    </div>

    <div id="printingarea">
        <h2>Messages</h2>

        <div id="messagesarea">
            <!-- Messages paragraphs go here, as server replies via WebSockets -->
        </div>
    </div>

    <!-- Dependencies -->
    <script src="scripts/joy.min.js" type="text/javascript"></script>
    <script src="scripts/encoding.js" type="text/javascript"></script>
    <script src="scripts/r2cp.js" type="text/javascript"></script>

    <!-- My JS Scripts -->
    <script src="scripts/operator.js" type="text/javascript"></script>
</body>

</html>
